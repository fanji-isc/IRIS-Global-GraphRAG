<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>LLM vs RAG</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body>
  <div class="wrap">
    <h1>LLM vs RAG</h1>

    <div class="chip-label">Try a demo question:</div>
    <div class="chips" id="chips">
      <button class="chip" data-q="What is RAG?">What is RAG?</button>
      <button class="chip" data-q="Who are the main researchers working on retrieval-augmented generation?">Key RAG researchers?</button>
      <button class="chip" data-q="What papers were published about GraphRAG in 2024?">Papers about GraphRAG in 2024?</button>
    </div>

    <div class="card" style="margin-bottom:16px;">
      <div class="section-body">
        <div class="inputbar">
          <input id="q" type="text" autocomplete="off" placeholder="Ask about a specific paper, method, or acronym…" />
          <button id="go">Compare</button>
        </div>
      </div>
    </div>

    <!-- Results are hidden until a search starts -->
    <div id="results" class="cols hidden">
      <!-- LLM card -->
      <div class="card llm-card">
        <div class="section-title llm-title">
          <div>
            <div class="method-name">LLM Alone</div>
          </div>
        </div>
        <div class="section-body">
          <div id="llm" class="answer"></div>
          <div id="llm-meta" class="meta-row hidden"></div>
        </div>
      </div>
      <!-- RAG card -->
      <div class="card rag-card">
        <div class="section-title rag-title">
          <div>
            <div class="method-name">RAG</div>
          </div>
        </div>
        <div class="section-body">
          <div id="rag" class="answer"></div>
          <div id="rag-meta" class="meta-row hidden"></div>
        </div>
      </div>
    </div>

    <!-- Settings switcher -->
    <div class="settings-wrapper" id="settings">
      <button class="settings-toggle" id="settings-toggle" title="Switch page">⚙️</button>
      <div class="settings-menu" id="settings-menu" role="dialog" aria-hidden="true">
        <form id="settings-form">
          <h4>Go to</h4>
          <label><input type="radio" name="mode" value="/llm"> LLM</label>
          <label><input type="radio" name="mode" value="/rag"> RAG</label>
          <label><input type="radio" name="mode" value="/graphrag"> GraphRAG</label>
          <label><input type="radio" name="mode" value="/llm-vs-rag"> LLM vs RAG</label>
          <label><input type="radio" name="mode" value="/rag-vs-graphrag"> RAG vs GraphRAG</label>
          <button type="submit" class="go-btn">Go</button>
        </form>
      </div>
    </div>

  </div>

  <script>
    const q       = document.getElementById('q');
    const go      = document.getElementById('go');
    const results = document.getElementById('results');
    const llmEl       = document.getElementById('llm');
    const ragEl       = document.getElementById('rag');
    const llmMetaEl   = document.getElementById('llm-meta');
    const ragMetaEl   = document.getElementById('rag-meta');

    function escHtml(s) {
      return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }
    function renderInline(s) {
      s = escHtml(s);
      s = s.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
      s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^)]+)\)/g,
        '<a href="$2" target="_blank" rel="noopener">$1</a>');
      return s;
    }
    function renderAnswer(el, text) {
      if (!text) { el.textContent = '(no answer)'; return; }
      const lines = text.split('\n');
      let html = '';
      let inList = false;
      for (const raw of lines) {
        const line = raw.trim();
        if (!line) { if (inList) { html += '</ul>'; inList = false; } continue; }
        if (line.startsWith('- ') || line.startsWith('• ')) {
          if (!inList) { html += '<ul>'; inList = true; }
          html += `<li>${renderInline(line.slice(2))}</li>`;
        } else {
          if (inList) { html += '</ul>'; inList = false; }
          html += `<p>${renderInline(line)}</p>`;
        }
      }
      if (inList) html += '</ul>';
      el.innerHTML = html;
    }

    function createTypingNode() {
      const wrap = document.createElement('div');
      wrap.className = 'typing';
      wrap.innerHTML = '<div class="dot"></div><div class="dot"></div><div class="dot"></div>';
      return wrap;
    }
    function startTyping(targetEl) {
      stopTyping(targetEl);
      targetEl.textContent = '';
      const node = createTypingNode();
      targetEl.appendChild(node);
      targetEl.__typingNode = node;
    }
    function stopTyping(targetEl) {
      if (targetEl && targetEl.__typingNode) {
        targetEl.__typingNode.remove();
        targetEl.__typingNode = null;
      }
    }

    async function run() {
      const query = q.value.trim();
      if (!query) return;
      go.disabled = true;

      results.classList.remove('hidden');
      startTyping(llmEl);
      startTyping(ragEl);
      llmMetaEl.classList.add('hidden');   llmMetaEl.innerHTML = '';
      ragMetaEl.classList.add('hidden');   ragMetaEl.innerHTML = '';

      const llmReq = fetch('/api/llm', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ query })
      }).then(r => r.json());

      const ragReq = fetch('/api/ask', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ query })
      }).then(r => r.json());

      try {
        const [llmRes, ragRes] = await Promise.allSettled([llmReq, ragReq]);

        // ── LLM result ──
        stopTyping(llmEl);
        if (llmRes.status === 'fulfilled' && !llmRes.value.error) {
          renderAnswer(llmEl, llmRes.value.answer);
          llmMetaEl.innerHTML = '<span class="meta-tag llm">⚡ No retrieval — parametric only</span>';
          llmMetaEl.classList.remove('hidden');
        } else {
          const msg = llmRes.status === 'fulfilled'
            ? (llmRes.value.error || 'Unknown error')
            : (llmRes.reason?.message || 'Network error');
          llmEl.textContent = 'Error: ' + msg;
        }

        // ── RAG result ──
        stopTyping(ragEl);
        if (ragRes.status === 'fulfilled' && !ragRes.value.error) {
          renderAnswer(ragEl, ragRes.value.answer);
          if (ragRes.value.meta) {
            ragMetaEl.innerHTML = `<span class="meta-tag rag">📄 ${ragRes.value.meta.paper_count} text chunks retrieved</span>`;
            ragMetaEl.classList.remove('hidden');
          }
        } else {
          const msg = ragRes.status === 'fulfilled'
            ? (ragRes.value.error || 'Unknown error')
            : (ragRes.reason?.message || 'Network error');
          ragEl.textContent = 'Error: ' + msg;
        }
      } finally {
        go.disabled = false;
      }
    }

    document.getElementById('chips').addEventListener('click', e => {
      const chip = e.target.closest('.chip');
      if (!chip) return;
      q.value = chip.dataset.q;
      run();
    });

    go.addEventListener('click', run);
    q.addEventListener('keydown', e => { if (e.key === 'Enter') run(); });

    (function setupSettingsSwitcher(){
      const toggle = document.getElementById('settings-toggle');
      const menu   = document.getElementById('settings-menu');
      const form   = document.getElementById('settings-form');

      toggle.addEventListener('click', (e) => {
        e.stopPropagation();
        menu.classList.toggle('open');
        if (menu.classList.contains('open')) {
          const first = form.querySelector('input[type=radio]');
          first && first.focus();
        }
      });
      document.addEventListener('click', (e) => {
        if (!menu.contains(e.target) && e.target !== toggle) menu.classList.remove('open');
      });
      document.addEventListener('keydown', (e) => { if (e.key === 'Escape') menu.classList.remove('open'); });

      const path = (location.pathname || '/').replace(/\/+$/, '') || '/';
      const map = new Map([
        ['/llm', '/llm'],
        ['/rag', '/rag'],
        ['/graphrag', '/graphrag'],
        ['/llm-vs-rag', '/llm-vs-rag'],
        ['/rag-vs-graphrag', '/rag-vs-graphrag']
      ]);
      const current = [...map.keys()].find(p => path === p) || '/llm';
      const radio = form.querySelector(`input[value="${map.get(current)}"]`);
      if (radio) radio.checked = true;

      form.addEventListener('submit', (e) => {
        e.preventDefault();
        const selected = form.querySelector('input[name="mode"]:checked');
        if (selected && selected.value) window.location.href = selected.value;
      });
    })();
  </script>
</body>
</html>
