<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>RAG vs GraphRAG</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

   <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">

</head>
<body>
  <div class="wrap">
    <h1>RAG vs GraphRAG</h1>

    <div class="chip-label">Try a demo question:</div>
    <div class="chips" id="chips">
      <button class="chip" data-q="Who are the top authors in GraphRAG research?">Who are the top authors in GraphRAG research?</button>
      <button class="chip" data-q="What topics connect the most papers in this graph?">What topics connect the most papers?</button>
      <button class="chip" data-q="How does GraphRAG improve over traditional RAG systems?">How does GraphRAG improve over RAG?</button>
    </div>

    <div class="card" style="margin-bottom:16px;">
      <div class="section-body">
        <div class="inputbar">
          <input id="q" type="text" autocomplete="off" placeholder="Ask one question to compare answers…" />
          <button id="go">Compare</button>
        </div>
      </div>
    </div>

    <!-- Results are hidden until a search starts -->
    <div id="results" class="cols hidden">
      <!-- RAG card -->
      <div class="card rag-card">
        <div class="section-title rag-title">
          <div>
            <div class="method-name">RAG</div>
          </div>
        </div>
        <div class="section-body">
          <div id="rag" class="answer">—</div>
          <div id="rag-meta" class="meta-row hidden"></div>
        </div>
      </div>
      <!-- GraphRAG card -->
      <div class="card gr-card">
        <div class="section-title gr-title">
          <div>
            <div class="method-name">GraphRAG</div>
          </div>
          <button id="show-graph" class="mini-btn" disabled>Show Graph</button>
        </div>
        <div class="section-body">
          <div id="gr" class="answer">—</div>
          <div id="gr-meta" class="meta-row hidden"></div>
          <div id="gr-entities" class="entity-pills hidden"></div>
          <div id="gr-sources" class="sources-section hidden"></div>
        </div>
      </div>
    </div>

    <!-- Settings switcher -->
    <div class="settings-wrapper" id="settings">
      <button class="settings-toggle" id="settings-toggle" title="Switch page">⚙️</button>
      <div class="settings-menu" id="settings-menu" role="dialog" aria-hidden="true">
        <form id="settings-form">
          <h4>Go to</h4>
          <label><input type="radio" name="mode" value="/llm"> LLM</label>
          <label><input type="radio" name="mode" value="/rag"> RAG</label>
          <label><input type="radio" name="mode" value="/graphrag"> GraphRAG</label>
          <label><input type="radio" name="mode" value="/llm-vs-rag"> LLM vs RAG</label>
          <label><input type="radio" name="mode" value="/rag-vs-graphrag"> RAG vs GraphRAG</label>
          <button type="submit" class="go-btn">Go</button>
        </form>
      </div>
    </div>

  </div>

  <!-- === Added: Modal to display the graph === -->
  <div id="graph-modal" class="modal" aria-hidden="true">
    <div class="modal-content">
      <div class="modal-header">
        <div>GraphRAG visualization</div>
        <button id="close-modal" class="modal-close">Close</button>
      </div>
      <div id="graph3d"></div>
    </div>
  </div>
  <!-- === end modal === -->

  <!-- === Added: 3D Force Graph lib === -->
  <script src="https://unpkg.com/3d-force-graph"></script>

  <script>
    const q       = document.getElementById('q');
    const go      = document.getElementById('go');
    const results = document.getElementById('results');
    const ragEl       = document.getElementById('rag');
    const grEl        = document.getElementById('gr');
    const ragMetaEl   = document.getElementById('rag-meta');
    const grMetaEl    = document.getElementById('gr-meta');
    const grEntitiesEl = document.getElementById('gr-entities');
    const grSourcesEl  = document.getElementById('gr-sources');

    // === show-graph button + modal refs ===
    const showBtn     = document.getElementById('show-graph');
    const modal       = document.getElementById('graph-modal');
    const closeModal  = document.getElementById('close-modal');
    const graph3dEl   = document.getElementById('graph3d');
    let LAST_GRAPH = null;
    let Graph3D = null;
    let graphInited = false;

    function escHtml(s) {
      return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }
    function renderInline(s) {
      s = escHtml(s);
      s = s.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
      s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^)]+)\)/g,
        '<a href="$2" target="_blank" rel="noopener">$1</a>');
      return s;
    }
    function renderAnswer(el, text) {
      if (!text) { el.textContent = '(no answer)'; return; }
      const lines = text.split('\n');
      let html = '';
      let inList = false;
      for (const raw of lines) {
        const line = raw.trim();
        if (!line) { if (inList) { html += '</ul>'; inList = false; } continue; }
        if (line.startsWith('- ') || line.startsWith('• ')) {
          if (!inList) { html += '<ul>'; inList = true; }
          html += `<li>${renderInline(line.slice(2))}</li>`;
        } else {
          if (inList) { html += '</ul>'; inList = false; }
          html += `<p>${renderInline(line)}</p>`;
        }
      }
      if (inList) html += '</ul>';
      el.innerHTML = html;
    }

    // typing indicator helpers (unchanged)
    function createTypingNode() {
      const wrap = document.createElement('div');
      wrap.className = 'typing';
      wrap.innerHTML = '<div class="dot"></div><div class="dot"></div><div class="dot"></div>';
      return wrap;
    }
    function startTyping(targetEl) {
      stopTyping(targetEl);
      targetEl.textContent = '';
      const node = createTypingNode();
      targetEl.appendChild(node);
      targetEl.__typingNode = node;
    }
    function stopTyping(targetEl) {
      if (targetEl && targetEl.__typingNode) {
        targetEl.__typingNode.remove();
        targetEl.__typingNode = null;
      }
    }

    function openGraphModal(graph) {
      if (!graph || !Array.isArray(graph.nodes) || graph.nodes.length === 0) {
        alert('No graph to display yet.');
        return;
      }
      modal.classList.add('open');

      requestAnimationFrame(() => requestAnimationFrame(() => {
        try {
          if (!graphInited) {
            const mc = modal.querySelector('.modal-content');
            const W = mc.offsetWidth;
            const H = mc.offsetHeight;
            const TYPE_COLORS = { paper:'#3b82f6', topic:'#a855f7', author:'#f59e0b' };
            const colorFor = t => TYPE_COLORS[String(t || '').trim().toLowerCase()] || '#9ca3af';

            Graph3D = ForceGraph3D()(graph3dEl)
              .width(W).height(H)
              .nodeColor(n => colorFor(n.type))
              .nodeLabel(n => `${n.id}${n.type ? ' ('+n.type+')':''}`)
              .linkColor(() => '#4b5563')
              .linkOpacity(0.4);

            const controls = Graph3D.controls && Graph3D.controls();
            if (controls) {
              controls.autoRotate = false;
              controls.enableDamping = true;
              controls.dampingFactor = 0.05;
            }
            graphInited = true;
          }
          if (Graph3D.resumeAnimation) Graph3D.resumeAnimation();
          Graph3D.graphData(graph);
        } catch(e) {
          graph3dEl.innerHTML = '<div style="color:#f87171;padding:24px;font-size:14px;">Error: ' + e.message + '</div>';
        }
      }));
    }
    function closeGraph() {
      modal.classList.remove('open');
      if (Graph3D && Graph3D.pauseAnimation) Graph3D.pauseAnimation();
    }
    closeModal.addEventListener('click', closeGraph);
    modal.addEventListener('click', (e) => { if (e.target === modal) closeGraph(); });
    showBtn.addEventListener('click', () => openGraphModal(LAST_GRAPH));

    async function run() {
      const query = q.value.trim();
      if (!query) return;
      go.disabled = true;

      results.classList.remove('hidden');
      startTyping(ragEl);
      startTyping(grEl);
      ragMetaEl.classList.add('hidden');   ragMetaEl.innerHTML = '';
      grMetaEl.classList.add('hidden');    grMetaEl.innerHTML = '';
      grEntitiesEl.classList.add('hidden'); grEntitiesEl.innerHTML = '';
      grSourcesEl.classList.add('hidden');  grSourcesEl.innerHTML = '';
      LAST_GRAPH = null;
      showBtn.disabled = true;

      const ragReq = fetch('/api/ask', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ query })
      }).then(r => r.json());

      const grReq = fetch('/api/graphrag', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ query })
      }).then(r => r.json());

      try {
        const [ragRes, grRes] = await Promise.allSettled([ragReq, grReq]);

        // ── RAG result ──
        stopTyping(ragEl);
        if (ragRes.status === 'fulfilled' && !ragRes.value.error) {
          renderAnswer(ragEl, ragRes.value.answer);
          if (ragRes.value.meta) {
            ragMetaEl.innerHTML = `<span class="meta-tag rag">📄 ${ragRes.value.meta.paper_count} text chunks retrieved</span>`;
            ragMetaEl.classList.remove('hidden');
          }
        } else {
          const msg = ragRes.status === 'fulfilled'
            ? (ragRes.value.error || 'Unknown error')
            : (ragRes.reason?.message || 'Network error');
          ragEl.textContent = 'Error: ' + msg;
        }

        // ── GraphRAG result ──
        stopTyping(grEl);
        if (grRes.status === 'fulfilled' && !grRes.value.error) {
          const gd = grRes.value;
          renderAnswer(grEl, gd.answer);

          // meta badges — break down by node type
          if (gd.meta) {
            const bt = gd.meta.by_type || {};
            const pc = bt.paper  != null ? bt.paper  : gd.meta.paper_count;
            const tc = bt.topic  || 0;
            const ac = bt.author || 0;
            let metaHtml = `<span class="meta-tag gr">📄 ${pc} papers</span>`;
            if (tc) metaHtml += `<span class="meta-tag gr">🏷 ${tc} topics</span>`;
            if (ac) metaHtml += `<span class="meta-tag gr">👤 ${ac} authors</span>`;
            metaHtml += `<span class="meta-tag gr">↔ ${gd.meta.edge_count} edges</span>`;
            grMetaEl.innerHTML = metaHtml;
            grMetaEl.classList.remove('hidden');
          }

          // entity pills — topics and authors from graph nodes
          const nodes = (gd.graph || {}).nodes || [];
          const topics  = [...new Set(nodes.filter(n => n.type === 'topic').map(n => n.id))].slice(0, 8);
          const authors = [...new Set(nodes.filter(n => n.type === 'author').map(n => n.id))].slice(0, 5);
          if (topics.length || authors.length) {
            grEntitiesEl.innerHTML =
              topics.map(t  => `<span class="entity-pill topic">🏷 ${t}</span>`).join('') +
              authors.map(a => `<span class="entity-pill author">👤 ${a}</span>`).join('');
            grEntitiesEl.classList.remove('hidden');
          }

          // sources list — paper titles with links
          const papersArr = gd.papers || [];
          if (papersArr.length) {
            grSourcesEl.innerHTML = '<div class="sources-label">Sources used by GraphRAG</div>' +
              papersArr.map(p => {
                const title = p.title || `Paper #${p.doc_id}`;
                return p.url
                  ? `<a class="source-link" href="${p.url}" target="_blank" rel="noopener">↗ ${title}</a>`
                  : `<span class="source-link no-url">· ${title}</span>`;
              }).join('');
            grSourcesEl.classList.remove('hidden');
          }

          LAST_GRAPH = gd.graph || null;
          const hasGraph = LAST_GRAPH && Array.isArray(LAST_GRAPH.nodes) && LAST_GRAPH.nodes.length > 0;
          showBtn.disabled = !hasGraph;
        } else {
          const msg = grRes.status === 'fulfilled'
            ? (grRes.value.error || 'Unknown error')
            : (grRes.reason?.message || 'Network error');
          grEl.textContent = 'Error: ' + msg;
          LAST_GRAPH = null;
          showBtn.disabled = true;
        }
      } finally {
        go.disabled = false;
      }
    }

    document.getElementById('chips').addEventListener('click', e => {
      const chip = e.target.closest('.chip');
      if (!chip) return;
      q.value = chip.dataset.q;
      run();
    });

    go.addEventListener('click', run);
    q.addEventListener('keydown', e => { if (e.key === 'Enter') run(); });

    (function setupSettingsSwitcher(){
      const toggle = document.getElementById('settings-toggle');
      const menu   = document.getElementById('settings-menu');
      const form   = document.getElementById('settings-form');

      toggle.addEventListener('click', (e) => {
        e.stopPropagation();
        menu.classList.toggle('open');
        if (menu.classList.contains('open')) {
          const first = form.querySelector('input[type=radio]');
          first && first.focus();
        }
      });
      document.addEventListener('click', (e) => {
        if (!menu.contains(e.target) && e.target !== toggle) menu.classList.remove('open');
      });
      document.addEventListener('keydown', (e) => { if (e.key === 'Escape') menu.classList.remove('open'); });

      const path = (location.pathname || '/').replace(/\/+$/, '') || '/';
      const map = new Map([
        ['/llm', '/llm'],
        ['/rag', '/rag'],
        ['/graphrag', '/graphrag'],
        ['/llm-vs-rag', '/llm-vs-rag'],
        ['/rag-vs-graphrag', '/rag-vs-graphrag']
      ]);
      const current = [...map.keys()].find(p => path === p) || '/llm';
      const radio = form.querySelector(`input[value="${map.get(current)}"]`);
      if (radio) radio.checked = true;

      form.addEventListener('submit', (e) => {
        e.preventDefault();
        const selected = form.querySelector('input[name="mode"]:checked');
        if (selected && selected.value) window.location.href = selected.value;
      });
    })();
  </script>
</body>
</html>
